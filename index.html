
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">

  <title>Quản Lý Cá Nhân</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <style>
    /* =========================================================
       01. DESIGN TOKENS
    ========================================================= */

    :root {
      --bg: #f5f6f8;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --surface-3: #f1f5f9;

      --text: #111827;
      --text-2: #64748b;
      --text-3: #94a3b8;

      --border: rgba(15, 23, 42, .08);
      --border-strong: rgba(15, 23, 42, .13);

      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-soft: rgba(99, 102, 241, .10);

      --income: #10b981;
      --income-soft: rgba(16, 185, 129, .10);

      --expense: #ef4444;
      --expense-soft: rgba(239, 68, 68, .10);

      --warning: #f59e0b;
      --warning-soft: rgba(245, 158, 11, .12);

      --shadow-sm:
        0 1px 2px rgba(15, 23, 42, .04),
        0 4px 14px rgba(15, 23, 42, .035);

      --shadow:
        0 10px 35px rgba(15, 23, 42, .07);

      --radius-sm: 10px;
      --radius: 16px;
      --radius-lg: 22px;

      --sidebar-width: 240px;

      --transition: 180ms ease;
    }

    html.dark {
      --bg: #09090b;
      --surface: #111113;
      --surface-2: #18181b;
      --surface-3: #222225;

      --text: #f4f4f5;
      --text-2: #a1a1aa;
      --text-3: #71717a;

      --border: rgba(255,255,255,.08);
      --border-strong: rgba(255,255,255,.14);

      --primary: #818cf8;
      --primary-dark: #6366f1;
      --primary-soft: rgba(129, 140, 248, .13);

      --income: #34d399;
      --income-soft: rgba(52, 211, 153, .11);

      --expense: #f87171;
      --expense-soft: rgba(248, 113, 113, .11);

      --warning: #fbbf24;
      --warning-soft: rgba(251, 191, 36, .11);

      --shadow-sm:
        0 1px 2px rgba(0,0,0,.2),
        0 5px 18px rgba(0,0,0,.18);

      --shadow:
        0 12px 40px rgba(0,0,0,.3);
    }

    /* =========================================================
       02. RESET
    ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "Segoe UI", sans-serif;

      background: var(--bg);
      color: var(--text);

      -webkit-font-smoothing: antialiased;
      transition:
        background var(--transition),
        color var(--transition);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    input,
    select,
    textarea {
      outline: none;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ul {
      list-style: none;
    }

    /* =========================================================
       03. LAYOUT
    ========================================================= */

    .app {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      z-index: 50;
      inset: 0 auto 0 0;

      width: var(--sidebar-width);

      display: flex;
      flex-direction: column;

      padding: 20px 14px;

      background: var(--surface);
      border-right: 1px solid var(--border);

      transition: transform .25s ease;
    }

    .main {
      width: calc(100% - var(--sidebar-width));
      margin-left: var(--sidebar-width);
      min-width: 0;
    }

    .main-inner {
      max-width: 1440px;
      margin: 0 auto;
      padding: 28px 34px 80px;
    }

    /* =========================================================
       04. BRAND
    ========================================================= */

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;

      padding: 7px 10px 25px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;

      display: grid;
      place-items: center;

      border-radius: 10px;

      color: white;

      background:
        linear-gradient(135deg, #818cf8, #4f46e5);

      box-shadow:
        0 7px 18px rgba(79,70,229,.25);

      font-size: 16px;
      font-weight: 800;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 750;
      letter-spacing: -.025em;
    }

    .brand-sub {
      margin-top: 2px;
      color: var(--text-3);
      font-size: 10px;
    }

    /* =========================================================
       05. SIDEBAR NAV
    ========================================================= */

    .nav-title {
      padding: 10px 10px 8px;

      color: var(--text-3);

      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .nav-item {
      width: 100%;

      display: flex;
      align-items: center;
      gap: 11px;

      padding: 10px 11px;
      margin-bottom: 3px;

      border-radius: 10px;

      color: var(--text-2);

      background: transparent;

      text-align: left;

      transition:
        background var(--transition),
        color var(--transition),
        transform var(--transition);
    }

    .nav-item:hover {
      color: var(--text);
      background: var(--surface-3);
    }

    .nav-item.active {
      color: var(--primary);
      background: var(--primary-soft);
      font-weight: 600;
    }

    .nav-icon {
      width: 18px;
      height: 18px;

      display: grid;
      place-items: center;

      font-size: 15px;
    }

    .sidebar-bottom {
      margin-top: auto;
    }

    .sidebar-tip {
      padding: 14px;

      border: 1px solid var(--border);
      border-radius: 14px;

      background: var(--surface-2);
    }

    .sidebar-tip strong {
      display: block;
      margin-bottom: 5px;

      font-size: 11px;
    }

    .sidebar-tip span {
      color: var(--text-3);
      font-size: 10px;
      line-height: 1.55;
    }

    /* =========================================================
       06. HEADER
    ========================================================= */

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
      margin-bottom: 30px;
    }

    .page-heading h1 {
      font-size: clamp(23px, 3vw, 30px);
      line-height: 1.15;
      letter-spacing: -.045em;
      font-weight: 750;
    }

    .page-heading p {
      margin-top: 7px;

      color: var(--text-2);

      font-size: 12px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;

      display: grid;
      place-items: center;

      border: 1px solid var(--border);
      border-radius: 11px;

      background: var(--surface);
      color: var(--text-2);

      box-shadow: var(--shadow-sm);

      transition: all var(--transition);
    }

    .icon-btn:hover {
      color: var(--text);
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    .mobile-menu {
      display: none;
    }

    /* =========================================================
       07. PAGE SECTIONS
    ========================================================= */

    .page {
      display: none;
      animation: pageIn .25s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .grid-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
    }

    /* =========================================================
       08. BALANCE CARD
    ========================================================= */

    .balance-card {
      position: relative;
      overflow: hidden;

      min-height: 220px;

      padding: 25px;

      background:
        radial-gradient(
          circle at 90% 10%,
          rgba(99,102,241,.17),
          transparent 35%
        ),
        var(--surface);
    }

    .balance-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .eyebrow {
      color: var(--text-3);

      font-size: 10px;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .balance-number {
      margin-top: 8px;

      font-size: clamp(30px, 4vw, 42px);
      line-height: 1;
      letter-spacing: -.055em;
      font-weight: 750;
    }

    .balance-meta {
      display: flex;
      align-items: center;
      gap: 7px;

      margin-top: 13px;

      font-size: 11px;
      color: var(--text-2);
    }

    .trend-up {
      display: inline-flex;
      align-items: center;
      gap: 3px;

      padding: 4px 7px;

      border-radius: 7px;

      color: var(--income);
      background: var(--income-soft);

      font-weight: 650;
    }

    .mini-chart {
      position: absolute;
      right: 20px;
      bottom: 18px;

      width: 42%;
      max-width: 250px;
      height: 75px;
    }

    /* =========================================================
       09. STAT CARDS
    ================================
